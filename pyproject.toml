[project]
name = "freeact"
dynamic = ["version"]
description = "Freeact code action agent"
authors = [
    { name = "Martin Krasser", email = "martin@gradion.ai" },
]
requires-python = ">=3.13,<3.15"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "aiostream>=0.7.1",
    "google-genai>=2.7.0",
    "pydantic-ai>=1.104.0",
    "python-dotenv>=1.2.2",
    "pillow>=12.2.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "textual>=8.2.7",
    "ipybox>=0.9.1",
    "mcpygen>=0.1.4",
    "sqlite-vec>=0.1.9",
    "watchfiles>=1.2.0",
    "trafilatura>=2.0.0",
]

[project.scripts]
freeact = "freeact.cli:main"

[tool.uv]
default-groups = [
    "docs",
    "dev",
]

[dependency-groups]
docs = [
    "griffe-pydantic>=1.3.1",
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.6,<10",
    "mkdocstrings-python>=2.0.3,<3",
    "mkdocs-llmstxt>=0.5.0",
    "click>=8.4.1",
]
dev = [
    "invoke>=3.0.3,<4",
    "pre-commit>=4.6.0,<5",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "pytest-xdist>=3.8.0",
    "types-pyyaml>=6.0.12.20260518",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
pattern = "default-unprefixed"
style = "pep440"

[tool.hatch.build.targets.sdist]
include = ["freeact"]

[tool.hatch.build.targets.wheel]
include = ["freeact"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "yaml.*"
]
ignore_missing_imports = true
