site_name: freeact
site_description: Freeact code action agent
site_url: https://gradion-ai.github.io/freeact/

repo_name: gradion-ai/freeact
repo_url: https://github.com/gradion-ai/freeact

copyright: Copyright &copy; 2025-2026 Gradion AI

theme:
  name: material
  logo: images/logo.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.preview
    - navigation.instant.progress
    - navigation.top
    - navigation.tracking
    - search.suggest
    - toc.follow
    - content.code.copy
    - content.code.select
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [freeact]
          options:
            show_root_heading: true
            show_source: false
            show_signature_annotations: true
            signature_crossrefs: true
            separate_signature: true
            merge_init_into_class: true
            extensions:
              - griffe_pydantic
          inventories:
            - url: https://docs.python.org/3/objects.inv
              domains: [py, std]
  - llmstxt:
      markdown_description: |
        General-purpose AI agent that acts via code actions through a unified execution interface.

        Freeact is a lightweight, general-purpose agent that acts via code actions in a stateful execution environment provided by ipybox.
        A unified execution interface allows code actions to contain any combination of Python code, shell commands, and programmatic MCP tool calls, generated in one LLM inference pass.

        For programmatic MCP tool calling ("code mode"), freeact generates typed Python APIs from MCP server schemas.
        The agent inspects generated APIs prior to execution and composes them within code actions based on available type information.
        Successful code actions can be saved as reusable tools, capturing agent experience as executable knowledge, optionally combined with agent skills.

        Freeact supports tool discovery via agentic and semantic search, loading only task-relevant tool information into the context window.
        It can enforce application-level approval of code actions, shell commands, and programmatic tool calls, originating from both main agents and subagents.
        Freeact runs locally on your computer and is available as a CLI tool and Python SDK.
      full_output: llms-full.txt
      sections:
        Getting started:
          - index.md: Overview, usage, and capabilities
          - getting-started/installation.md: Setup and installation instructions
          - getting-started/quickstart.md: Running a first task with the CLI tool
          - getting-started/sdk-tutorial.md: Building a first agent with the Agent SDK
        How-to guides:
          - guides/models.md: Model configuration, provider settings, and custom providers
          - guides/tool-servers.md: Bundled tool servers and custom MCP servers for JSON and programmatic tool calling
          - guides/tool-discovery.md: Basic and hybrid tool discovery setup
          - guides/permissions.md: Approval prompts, permission rules, and approval automation
          - guides/sandbox.md: Sandbox mode for code execution and MCP servers
          - guides/sessions.md: Session persistence and resumption
          - guides/skills.md: Custom and bundled agent skills
          - guides/saving-tools.md: Saving code actions as reusable tools
          - guides/enhancing-tools.md: Enhancing generated tool APIs with output parsers
          - guides/python-packages.md: Using Python packages in code actions
        Reference:
          - reference/configuration.md: Configuration file format, agent and terminal settings, and directory structure
          - reference/cli.md: CLI commands, options, and interactive mode
          - reference/environment.md: API keys, variable references, and hybrid search variables
          - reference/permission-rules.md: Permission rule format, tiers, and pattern matching semantics
        Concepts:
          - concepts/code-actions.md: Code actions and unified execution of Python code, shell commands, and tool calls
          - concepts/approvals.md: Approval model and permission tiers
          - concepts/runtime.md: Event stream, turns, subagents, and cancellation
        API Reference:
          - api/agent.md: Agent class, events, and approval workflow
          - api/config.md: Configuration loading and resolution
          - api/generate.md: MCP tool API generation
          - api/permissions.md: Permission management for tool approvals

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      dedent_subsections: true
  - pymdownx.superfences
  - pymdownx.details
  - footnotes
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

hooks:
  - scripts/mkdocs_redirects.py

nav:
  - Overview: index.md
  - Getting started:
    - Installation: getting-started/installation.md
    - CLI quickstart: getting-started/quickstart.md
    - First agent with the SDK: getting-started/sdk-tutorial.md
  - How-to guides:
    - Configure models: guides/models.md
    - Add custom tool servers: guides/tool-servers.md
    - Enable tool discovery: guides/tool-discovery.md
    - Manage permissions: guides/permissions.md
    - Use sandbox mode: guides/sandbox.md
    - Persist and resume sessions: guides/sessions.md
    - Create agent skills: guides/skills.md
    - Save code actions as tools: guides/saving-tools.md
    - Enhance generated tools: guides/enhancing-tools.md
    - Use Python packages: guides/python-packages.md
  - Reference:
    - Configuration: reference/configuration.md
    - CLI: reference/cli.md
    - Environment variables: reference/environment.md
    - Permission rules: reference/permission-rules.md
    - API:
      - Agent: api/agent.md
      - Config: api/config.md
      - Generate: api/generate.md
      - Permissions: api/permissions.md
  - Concepts:
    - Code actions: concepts/code-actions.md
    - Approvals and permissions: concepts/approvals.md
    - Runtime model: concepts/runtime.md
  - LLM readable:
    - llms.txt: llms.txt
    - llms-full.txt: llms-full.txt
