name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ vars.CI_UV_VERSION }}
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: |
          uv sync --locked --all-extras --dev
          uv pip list

      - name: Run unit tests
        run: |
          uv run invoke ut

      - name: Run integration tests
        run: |
          # TEMP EXPERIMENT (freeact#98): run integration tests sequentially
          # (no pytest-xdist) to test whether parallel kernel startup is the
          # cause of flaky code-executor startup timeouts. The kernel_init
          # timeout (30s in test config) is held constant, so this isolates
          # parallelism as the only changed variable vs the failed parallel run.
          # Revert to `uv run invoke it --parallel` once the experiment concludes.
          uv run pytest tests/integration
